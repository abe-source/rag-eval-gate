<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title">
  <title id="hero-title">rag-eval-gate: LLM/RAG evals as a CI merge gate</title>
  <defs>
    <radialGradient id="glow" cx="82%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0a0d0e"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Eval scores vs a threshold line, right side -->
  <g>
    <line x1="930" y1="150" x2="1150" y2="150" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.55"/>

    <g>
      <rect x="944"  y="118" width="18" height="107" fill="#22d3ee" opacity="0.85"/>
      <rect x="978"  y="94"  width="18" height="131" fill="#22d3ee" opacity="0.85"/>
      <rect x="1012" y="132" width="18" height="93"  fill="#22d3ee" opacity="0.85"/>
      <rect x="1046" y="176" width="18" height="49"  fill="#155e75" opacity="0.95"/>
      <rect x="1080" y="104" width="18" height="121" fill="#22d3ee" opacity="0.85"/>
      <rect x="1114" y="124" width="18" height="101" fill="#22d3ee" opacity="0.85"/>
    </g>

    <g fill="#67e8f9">
      <circle cx="953"  cy="118" r="3"/>
      <circle cx="987"  cy="94"  r="3"/>
      <circle cx="1021" cy="132" r="3"/>
      <circle cx="1089" cy="104" r="3"/>
      <circle cx="1123" cy="124" r="3"/>
    </g>
    <circle cx="1055" cy="176" r="3" fill="#155e75"/>
  </g>

  <!-- Text -->
  <text x="80" y="140" font-family="'SF Mono', 'Fira Code', ui-monospace, Menlo, monospace" font-size="46" font-weight="700" fill="#f0f4f5">
    rag-eval-<tspan fill="#22d3ee">gate</tspan>
  </text>
  <text x="80" y="180" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#9ca3a3">
    LLM/RAG evals as a CI merge gate
  </text>
  <text x="80" y="225" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#4b5563">
    faithfulness · recall · refusal · hallucination
  </text>
</svg>
